name: CI-CD Unreal Engine Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      logs: ${{ steps.capture.outputs.logs }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ❌ Intentional failure
      - name: Intentional error
        run: |
          some_command_that_does_not_exist

      # ✅ Capture logs (THIS WAS BROKEN BEFORE)
      - name: Capture logs
        id: capture
        if: failure()
        run: |
          echo "logs<<EOF" >> $GITHUB_OUTPUT
          echo "Command failed: some_command_that_does_not_exist" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  call-ci-bot:
    needs: build
    if: failure()
    uses: vyaspurva20/ci-bot-agent/.github/workflows/agent.yml@v1
    with:
      logs: ${{ needs.build.outputs.logs }}
      repo: ${{ github.repository }}
    secrets:
      AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
